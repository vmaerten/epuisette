version: '3'

vars:
  APP_NAME: epuisette
  BIN_DIR: bin
  BUNDLE: Épuisette.app
  APP: '{{.BIN_DIR}}/{{.BUNDLE}}'

tasks:
  dev:
    desc: Build and open the app from the sources
    cmds:
      - go run .

  bindings:
    desc: Regenerate the JS bindings after changing the Service methods
    cmds:
      # -b imports the runtime the app serves itself, so the page needs no npm.
      - wails3 generate bindings -clean -b -noevents -d frontend/bindings

  build:
    desc: Build the production binary
    env:
      CGO_ENABLED: '1'
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o {{.BIN_DIR}}/{{.APP_NAME}} .

  package:
    desc: Assemble and ad-hoc sign the .app bundle in bin/ (optional VERSION)
    deps: [build]
    vars:
      VERSION: '{{.VERSION | default "0.0.0"}}'
    cmds:
      - rm -rf "{{.APP}}"
      - mkdir -p "{{.APP}}/Contents/MacOS" "{{.APP}}/Contents/Resources"
      - cp build/darwin/Info.plist "{{.APP}}/Contents/"
      - plutil -replace CFBundleShortVersionString -string "{{.VERSION}}" "{{.APP}}/Contents/Info.plist"
      # CFBundleVersion takes numbers only: a prerelease keeps its X.Y.Z.
      - plutil -replace CFBundleVersion -string "{{index (splitList "-" .VERSION) 0}}" "{{.APP}}/Contents/Info.plist"
      - cp build/darwin/icons.icns "{{.APP}}/Contents/Resources/"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP}}/Contents/MacOS/"
      - codesign --force --deep --sign - "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"

  install:
    desc: Package the app and copy it to ~/Applications
    deps: [package]
    cmds:
      - mkdir -p ~/Applications
      - rm -rf ~/Applications/{{.BUNDLE}}
      # ditto keeps the signature and extended attributes intact.
      - ditto "{{.APP}}" ~/Applications/{{.BUNDLE}}

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  lint:
    desc: Check formatting and run go vet
    cmds:
      - test -z "$(gofmt -l $(go list -f '{{"{{"}}.Dir{{"}}"}}' ./...))"
      - go vet ./...

  release:notes:
    desc: Print the CHANGELOG.md section of VERSION, which becomes the release notes
    silent: true
    requires:
      vars: [VERSION]
    cmds:
      - |
        notes=$(awk -v v="{{.VERSION}}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md | sed '/./,$!d')
        if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
          echo 'CHANGELOG.md has no "## {{.VERSION}}" section, or it is empty' >&2
          exit 1
        fi
        printf '%s\n' "$notes"

  release:build:
    desc: Build and verify the release archive of TAG without publishing it
    requires:
      vars: [TAG]
    vars:
      VERSION: '{{trimPrefix "v" .TAG}}'
      ZIP: 'dist/epuisette_{{trimPrefix "v" .TAG}}_darwin_arm64.zip'
    preconditions:
      - sh: printf '%s' "{{.TAG}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
        msg: TAG must look like v1.2.3 or v1.2.3-rc.1
      - sh: '[ "$(git rev-parse --verify --quiet "{{.TAG}}^{commit}")" = "$(git rev-parse HEAD)" ]'
        msg: '{{.TAG}} is not a tag on the checked-out commit'
      - sh: test -z "$(git status --porcelain)"
        msg: The working tree has uncommitted changes
    cmds:
      # Missing notes fail before the build.
      - '{{.TASK_EXE}} release:notes VERSION={{.VERSION}} > /dev/null'
      - task: package
        vars: { VERSION: '{{.VERSION}}' }
      - rm -rf dist && mkdir dist
      # ditto keeps the bundle's signature and file modes.
      - ditto -c -k --sequesterRsrc --keepParent "{{.APP}}" "{{.ZIP}}"
      - cd dist && shasum -a 256 "$(basename "{{.ZIP}}")" > checksums.txt
      - task: release:verify
        vars: { VERSION: '{{.VERSION}}', ZIP: '{{.ZIP}}' }

  release:verify:
    internal: true
    cmds:
      - cd dist && shasum -a 256 -c checksums.txt
      - |
        set -eu
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        ditto -x -k "{{.ZIP}}" "$dir"
        app="$dir/{{.BUNDLE}}"
        codesign --verify --deep --strict "$app"
        version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
        [ "$version" = "{{.VERSION}}" ] || { echo "The bundle says $version, not {{.VERSION}}" >&2; exit 1; }
        echo "Verified {{.ZIP}}"

  release:
    desc: Build, verify and publish the release of TAG, then point the Homebrew cask at it
    requires:
      vars: [TAG]
    cmds:
      - task: release:build
        vars: { TAG: '{{.TAG}}' }
      - task: release:tap:access
        vars: { TAG: '{{.TAG}}' }
      - task: release:publish
        vars: { TAG: '{{.TAG}}' }
      - task: release:tap
        vars: { TAG: '{{.TAG}}' }

  release:publish:
    internal: true
    vars:
      VERSION: '{{trimPrefix "v" .TAG}}'
    cmds:
      - |
        set -eu
        notes=$(mktemp)
        trap 'rm -f "$notes"' EXIT
        {{.TASK_EXE}} release:notes VERSION={{.VERSION}} > "$notes"
        set --
        case "{{.VERSION}}" in *-*) set -- --prerelease;; esac
        # A draft until both files are uploaded; an existing release makes this fail.
        gh release create "{{.TAG}}" --verify-tag --draft --title "{{.TAG}}" --notes-file "$notes" "$@" \
          "dist/epuisette_{{.VERSION}}_darwin_arm64.zip" dist/checksums.txt
        gh release edit "{{.TAG}}" --verify-tag --draft=false

  release:tap:access:
    internal: true
    cmds:
      # Fail before publishing rather than leave a release the cask does not offer.
      - |
        set -eu
        case "{{.TAG}}" in *-*) exit 0;; esac
        if [ -n "${GITHUB_ACTIONS:-}" ] && [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
          echo "HOMEBREW_TAP_TOKEN is not set: the workflow could not push the cask" >&2
          exit 1
        fi
        if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then export GH_TOKEN="$HOMEBREW_TAP_TOKEN"; fi
        gh api repos/vmaerten/homebrew-tap --jq .full_name > /dev/null || {
          echo "Cannot reach vmaerten/homebrew-tap: set HOMEBREW_TAP_TOKEN" >&2
          exit 1
        }

  release:tap:
    desc: Point the Homebrew cask at the published stable release TAG
    requires:
      vars: [TAG]
    vars:
      VERSION: '{{trimPrefix "v" .TAG}}'
    cmds:
      - |
        set -eu
        version="{{.VERSION}}"
        case "$version" in *-*) echo "{{.TAG}} is a prerelease: the cask keeps the last stable release"; exit 0;; esac
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        # From the published release, so this can rerun on its own after a failed push.
        gh release download "{{.TAG}}" -R vmaerten/epuisette --pattern checksums.txt --dir "$work"
        sha=$(awk -v f="epuisette_${version}_darwin_arm64.zip" '$2 == f {print $1}' "$work/checksums.txt")
        printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$' || { echo "checksums.txt has no epuisette_${version}_darwin_arm64.zip" >&2; exit 1; }
        sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" build/darwin/cask.rb > "$work/epuisette.rb"
        # The workflow's own token reaches only this repository; the tap needs its own.
        if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then export GH_TOKEN="$HOMEBREW_TAP_TOKEN"; fi
        cask=repos/vmaerten/homebrew-tap/contents/Casks/epuisette.rb
        # A rerun of an older tag must not move the cask back.
        offered=$(gh api -H 'Accept: application/vnd.github.raw' "$cask" 2>/dev/null | sed -n 's/^  version "\(.*\)"$/\1/p' || true)
        if [ -n "$offered" ] && [ "$offered" != "$version" ] &&
          [ "$(printf '%s\n%s\n' "$offered" "$version" | sort -V | tail -n 1)" = "$offered" ]; then
          echo "The tap already offers epuisette $offered; leaving it"
          exit 0
        fi
        set -- -f message="epuisette $version" -f content="$(base64 < "$work/epuisette.rb" | tr -d '\n')"
        if current=$(gh api "$cask" --jq .sha 2>/dev/null); then set -- "$@" -f sha="$current"; fi
        gh api --method PUT "$cask" "$@" > /dev/null
        echo "Cask epuisette $version pushed to vmaerten/homebrew-tap"

