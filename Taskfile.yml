version: '3'

vars:
  APP_NAME: video-downloader
  BIN_DIR: bin
  APP: '{{.BIN_DIR}}/{{.APP_NAME}}.app'

tasks:
  dev:
    desc: Build and open the app from the sources
    cmds:
      - go run .

  bindings:
    desc: Regenerate the JS bindings after changing the Service methods
    cmds:
      # -b imports the runtime the app serves itself, so the page needs no npm.
      - wails3 generate bindings -clean -b -noevents -d frontend/bindings

  build:
    desc: Build the production binary
    env:
      CGO_ENABLED: '1'
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o {{.BIN_DIR}}/{{.APP_NAME}} .

  package:
    desc: Assemble and ad-hoc sign the .app bundle in bin/
    deps: [build]
    cmds:
      - rm -rf "{{.APP}}"
      - mkdir -p "{{.APP}}/Contents/MacOS" "{{.APP}}/Contents/Resources"
      - cp build/darwin/Info.plist "{{.APP}}/Contents/"
      - cp build/darwin/icons.icns "{{.APP}}/Contents/Resources/"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP}}/Contents/MacOS/"
      - codesign --force --deep --sign - "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"

  install:
    desc: Package the app and copy it to ~/Applications
    deps: [package]
    cmds:
      - mkdir -p ~/Applications
      - rm -rf ~/Applications/{{.APP_NAME}}.app
      # ditto keeps the signature and extended attributes intact.
      - ditto "{{.APP}}" ~/Applications/{{.APP_NAME}}.app

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  lint:
    desc: Check formatting and run go vet
    cmds:
      - test -z "$(gofmt -l $(go list -f '{{"{{"}}.Dir{{"}}"}}' ./...))"
      - go vet ./...

  py:dev:
    desc: Run the former Python server on localhost with auto-reload
    cmds:
      - uv run uvicorn video_downloader.main:app --reload --port 8787

  py:lint:
    desc: Check Python lint rules and formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  py:fmt:
    desc: Fix Python lint issues and format the code
    cmds:
      - uv run ruff check --fix
      - uv run ruff format

  py:test:
    desc: Run the Python tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}
